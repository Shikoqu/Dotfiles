# ! ! ! ! ! ! ! ! ! ! ! ! ! ! ! ! !
# ! REMEMBER ABOUT POLISH LETTERS !
# ! ! ! ! ! ! ! ! ! ! ! ! ! ! ! ! !
config-version = 2
start-at-login = true
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
on-focus-changed = ['move-mouse window-lazy-center']

persistent-workspaces = ["🍷", "🍸", "🍹", "🦀", "🦋", "🪶"]
[workspace-to-monitor-force-assignment]
  '🍷' = 'main'
  '🍸' = 'main'
  '🍹' = 'main'
  '🦀' = ['secondary', 'main']
  '🦋' = ['secondary', 'main']
  '🪶' = ['secondary', 'main']

accordion-padding = 30
[gaps]
  inner.horizontal = 8
  inner.vertical =   8
  outer.left =       8
  outer.bottom =     8
  outer.top =        [{ monitor."built-in.*" = 2 }, 8]
  outer.right =      8

# Define my fancy unicorn key notation
[key-mapping.key-notation-to-key-code]
  up___ = 'i'
  down_ = 'k'
  left_ = 'j'
  right = 'l'
  # meh = 'ctrl-alt-cmd'
  # hyper = 'shift-ctrl-alt-cmd'

[mode.main.binding]

  ctrl-left_ = 'focus --boundaries-action wrap-around-the-workspace left'
  ctrl-down_ = 'focus --boundaries-action wrap-around-the-workspace down'
  ctrl-up___ = 'focus --boundaries-action wrap-around-the-workspace up'
  ctrl-right = 'focus --boundaries-action wrap-around-the-workspace right'

  ctrl-alt-left_ = 'move left'
  ctrl-alt-down_ = 'move down'
  ctrl-alt-up___ = 'move up'
  ctrl-alt-right = 'move right'

  ctrl-shift-left_ = 'join-with left'
  ctrl-shift-down_ = 'join-with down'
  ctrl-shift-up___ = 'join-with up'
  ctrl-shift-right = 'join-with right'

  ctrl-u = 'layout horizontal vertical'
  ctrl-o = 'layout tiles accordion'
  ctrl-alt-space = 'layout floating tiling'

  ctrl-p = 'macos-native-fullscreen'

  ctrl-w = "workspace 🍷"
  ctrl-e = "workspace 🍸"
  ctrl-r = "workspace 🍹"
  ctrl-s = "workspace 🦀"
  ctrl-d = "workspace 🦋"
  ctrl-f = "workspace 🪶"

  ctrl-alt-w = "move-node-to-workspace 🍷"
  ctrl-alt-e = "move-node-to-workspace 🍸"
  ctrl-alt-r = "move-node-to-workspace 🍹"
  ctrl-alt-s = "move-node-to-workspace 🦀"
  ctrl-alt-d = "move-node-to-workspace 🦋"
  ctrl-alt-f = "move-node-to-workspace 🪶"

  # chocofi layout
  ctrl-alt-cmd-a = 'focus left'
  ctrl-alt-cmd-e = 'focus up'
  ctrl-alt-cmd-h = 'focus down'
  ctrl-alt-cmd-i = 'focus right'

  ctrl-alt-cmd-o = 'move left'
  ctrl-alt-cmd-y = 'move down'
  ctrl-alt-cmd-k = 'move up'
  ctrl-alt-cmd-j = 'move right'

  ctrl-alt-cmd-quote = 'join-with left'
  ctrl-alt-cmd-u = 'join-with up'
  ctrl-alt-cmd-p = 'join-with down'
  ctrl-alt-cmd-q = 'join-with right'

  ctrl-alt-cmd-semicolon = 'layout horizontal vertical'
  ctrl-alt-cmd-period = 'layout tiles accordion'
  ctrl-alt-cmd-comma = 'layout floating tiling'

  ctrl-alt-cmd-f = 'macos-native-fullscreen'

  ctrl-alt-cmd-s = "workspace 🍷"
  ctrl-alt-cmd-n = "workspace 🍸"
  ctrl-alt-cmd-t = "workspace 🍹"
  ctrl-alt-cmd-w = "workspace 🦀"
  ctrl-alt-cmd-m = "workspace 🦋"
  ctrl-alt-cmd-d = "workspace 🪶"

  shift-ctrl-alt-cmd-s = "move-node-to-workspace 🍷"
  shift-ctrl-alt-cmd-n = "move-node-to-workspace 🍸"
  shift-ctrl-alt-cmd-t = "move-node-to-workspace 🍹"
  shift-ctrl-alt-cmd-w = "move-node-to-workspace 🦀"
  shift-ctrl-alt-cmd-m = "move-node-to-workspace 🦋"
  shift-ctrl-alt-cmd-d = "move-node-to-workspace 🪶"

  # disable hide application or other macOS shortcuts
  cmd-h = []
  cmd-alt-h = []

  ctrl-alt-c = 'reload-config'

  ctrl-alt-x = 'mode resize'

##################################################

[mode.resize.binding]
  ctrl-left_ = 'resize width -50'
  ctrl-down_ = 'resize height +50'
  ctrl-up___ = 'resize height -50'
  ctrl-right = 'resize width +50'
  enter = 'mode main'
  esc = 'mode main'

##################################################

[[on-window-detected]] # Preview
  if.app-id = 'com.apple.Preview'
  run = 'layout floating'

[[on-window-detected]] # AppCleaner
  if.app-id = 'net.freemacsoft.AppCleaner'
  run = 'layout floating'

[[on-window-detected]] # Passwords
  if.app-id = 'com.apple.Passwords'
  run = 'layout floating'
