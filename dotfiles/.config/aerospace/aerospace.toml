# ! ! ! ! ! ! ! ! ! ! ! ! ! ! ! ! !
# ! REMEMBER ABOUT POLISH LETTERS !
# ! ! ! ! ! ! ! ! ! ! ! ! ! ! ! ! !
config-version = 2
start-at-login = true
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
on-focus-changed = ['move-mouse window-lazy-center']

persistent-workspaces = ["🍷", "🍸", "🍹", "🦀", "🦋", "🪶"]
[workspace-to-monitor-force-assignment]
  '🍷' = 'main'
  '🍸' = 'main'
  '🍹' = 'main'
  '🦀' = ['secondary', 'main']
  '🦋' = ['secondary', 'main']
  '🪶' = ['secondary', 'main']

accordion-padding = 30
[gaps]
  inner.horizontal = 8
  inner.vertical =   8
  outer.left =       8
  outer.bottom =     8
  outer.top =        [{ monitor."built-in.*" = 2 }, 8]
  outer.right =      8

##################################################

[mode.main.binding]
  ctrl-alt-cmd-j         = 'focus --boundaries all-monitors-outer-frame left'
  ctrl-alt-cmd-k         = 'focus --boundaries all-monitors-outer-frame up'
  ctrl-alt-cmd-l         = 'focus --boundaries all-monitors-outer-frame down'
  ctrl-alt-cmd-semicolon = 'focus --boundaries all-monitors-outer-frame right'

  ctrl-alt-cmd-m         = 'move left'
  ctrl-alt-cmd-comma     = 'move up'
  ctrl-alt-cmd-period    = 'move down'
  ctrl-alt-cmd-slash     = 'move right'

  ctrl-alt-cmd-u         = 'join-with left'
  ctrl-alt-cmd-i         = 'join-with up'
  ctrl-alt-cmd-o         = 'join-with down'
  ctrl-alt-cmd-p         = 'join-with right'

  ctrl-alt-cmd-y = 'layout horizontal vertical'
  ctrl-alt-cmd-h = 'layout tiles accordion'
  ctrl-alt-cmd-n = 'layout floating tiling'

  ctrl-alt-cmd-g = 'macos-native-fullscreen'

  ctrl-alt-cmd-w = "workspace 🍷"
  ctrl-alt-cmd-e = "workspace 🍸"
  ctrl-alt-cmd-r = "workspace 🍹"
  ctrl-alt-cmd-s = "workspace 🦀"
  ctrl-alt-cmd-d = "workspace 🦋"
  ctrl-alt-cmd-f = "workspace 🪶"

  ctrl-alt-cmd-shift-w = "move-node-to-workspace 🍷"
  ctrl-alt-cmd-shift-e = "move-node-to-workspace 🍸"
  ctrl-alt-cmd-shift-r = "move-node-to-workspace 🍹"
  ctrl-alt-cmd-shift-s = "move-node-to-workspace 🦀"
  ctrl-alt-cmd-shift-d = "move-node-to-workspace 🦋"
  ctrl-alt-cmd-shift-f = "move-node-to-workspace 🪶"

  # disable hide application or other macOS shortcuts
  cmd-h = []
  cmd-alt-h = []

  ctrl-alt-cmd-shift-c = 'reload-config'

  ctrl-alt-cmd-shift-z = 'mode chocofi'
  ctrl-alt-cmd-shift-x = 'mode resize-main'

##################################################

[mode.chocofi.binding]
  ctrl-alt-cmd-a = 'focus left'
  ctrl-alt-cmd-e = 'focus up'
  ctrl-alt-cmd-h = 'focus down'
  ctrl-alt-cmd-i = 'focus right'

  ctrl-alt-cmd-o = 'move left'
  ctrl-alt-cmd-y = 'move down'
  ctrl-alt-cmd-k = 'move up'
  ctrl-alt-cmd-j = 'move right'

  ctrl-alt-cmd-quote = 'join-with left'
  ctrl-alt-cmd-u     = 'join-with up'
  ctrl-alt-cmd-p     = 'join-with down'
  ctrl-alt-cmd-q     = 'join-with right'

  ctrl-alt-cmd-semicolon = 'layout horizontal vertical'
  ctrl-alt-cmd-period    = 'layout tiles accordion'
  ctrl-alt-cmd-comma     = 'layout floating tiling'

  ctrl-alt-cmd-f = 'macos-native-fullscreen'

  ctrl-alt-cmd-s = "workspace 🍷"
  ctrl-alt-cmd-n = "workspace 🍸"
  ctrl-alt-cmd-t = "workspace 🍹"
  ctrl-alt-cmd-w = "workspace 🦀"
  ctrl-alt-cmd-m = "workspace 🦋"
  ctrl-alt-cmd-d = "workspace 🪶"

  shift-ctrl-alt-cmd-s = "move-node-to-workspace 🍷"
  shift-ctrl-alt-cmd-n = "move-node-to-workspace 🍸"
  shift-ctrl-alt-cmd-t = "move-node-to-workspace 🍹"
  shift-ctrl-alt-cmd-w = "move-node-to-workspace 🦀"
  shift-ctrl-alt-cmd-m = "move-node-to-workspace 🦋"
  shift-ctrl-alt-cmd-d = "move-node-to-workspace 🪶"

  # disable hide application or other macOS shortcuts
  cmd-h = []
  cmd-alt-h = []

  ctrl-alt-cmd-shift-c = 'reload-config'

  ctrl-alt-cmd-shift-z = 'mode main'
  ctrl-alt-cmd-shift-x = 'mode resize-chocofi'

##################################################

[mode.resize-main.binding]
  ctrl-alt-cmd-j         = 'resize width -50'
  ctrl-alt-cmd-k         = 'resize height +50'
  ctrl-alt-cmd-l         = 'resize height -50'
  ctrl-alt-cmd-semicolon = 'resize width +50'
  enter = 'mode main'
  esc   = 'mode main'

[mode.resize-chocofi.binding]
  ctrl-alt-cmd-a = 'resize width -50'
  ctrl-alt-cmd-e = 'resize height +50'
  ctrl-alt-cmd-h = 'resize height -50'
  ctrl-alt-cmd-i = 'resize width +50'
  enter = 'mode chocofi'
  esc   = 'mode chocofi'

##################################################

[[on-window-detected]] # Preview
  if.app-id = 'com.apple.Preview'
  run = 'layout floating'

[[on-window-detected]] # AppCleaner
  if.app-id = 'net.freemacsoft.AppCleaner'
  run = 'layout floating'

[[on-window-detected]] # Passwords
  if.app-id = 'com.apple.Passwords'
  run = 'layout floating'
